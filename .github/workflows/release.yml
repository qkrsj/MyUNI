# 태그를 밀면 윈도우와 맥을 각자 빌드해서 GitHub 릴리스에 올린다.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 크로스 빌드는 안 되므로 러너를 둘 쓴다. 올리는 파일 이름은 버전 없이 고정이다
# (MyUNi-Setup.exe, MyUNi.dmg) - 다운로드 페이지(docs/)가 releases/latest/download/<이름> 으로 바로 건다.
#
# 배포판이 붙을 서버(내 AWS) 주소는 저장소 Settings > Secrets and variables > Actions >
# Variables 의 MYUNI_SERVER_URL 이다. 비어 있으면 릴리스를 멈춘다 - 그대로 내보내면
# 사용자 PC 의 127.0.0.1 로 붙는 판이 나간다.
#
# 아직 코드 서명은 하지 않는다. 윈도우는 SmartScreen 경고가, 맥은 "확인되지 않은 개발자"
# 경고가 뜬다 (맥은 우클릭 > 열기로 처음 한 번 열면 된다).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "올릴 태그 (예: v0.1.0). 이미 있어야 한다"
        required: true

permissions:
  contents: write

jobs:
  # 태그와 common/version.py 가 어긋나면 멈춘다. 어긋나면 클라이언트 버전 확인이 엉뚱하게 돈다.
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver=$(python3 -c "import sys; sys.path.insert(0, '.'); from common.version import VERSION; print(VERSION)")
          echo "태그 $tag / common/version.py $ver"
          [ "$tag" = "v$ver" ] || { echo "::error::태그($tag)와 버전(v$ver)이 다릅니다."; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: 서버 주소 확인
        run: |
          url="${{ vars.MYUNI_SERVER_URL }}"
          case "$url" in
            https://*) echo "서버: $url" ;;
            *) echo "::error::저장소 Variables 에 MYUNI_SERVER_URL(https://...)을 넣어 주세요."; exit 1 ;;
          esac

  build:
    needs: check
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비물
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt pyinstaller pytest
      - name: 검사
        run: python -m pytest -q common client
      - name: Inno Setup (윈도우 설치 파일)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: 빌드
        run: python tools/build.py --server "${{ vars.MYUNI_SERVER_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/MyUNi-Setup.exe
            dist/MyUNi.dmg
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.check.outputs.tag }}"
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "${{ github.repository }}" --title "MyUNi $tag" --notes "MyUNi $tag"
          gh release upload "$tag" out/MyUNi-Setup.exe out/MyUNi.dmg --repo "${{ github.repository }}" --clobber
